/* Mi Día 0.2: minimal dark-blue visual system */
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#090d14;color:#edf3fc}
body{background:#090d14}
main{max-width:610px;padding:28px 17px 85px}
header{padding:8px 3px 3px}
h1{font-size:27px;letter-spacing:-.9px;font-weight:720}
h2{font-size:19px;letter-spacing:-.45px;margin:0 0 10px}
h3{font-size:16px}
small,.muted{color:#8b9bb2}
nav{background:#121a27;border:1px solid #253246;padding:5px;border-radius:17px;gap:4px;margin:24px 0 18px}
nav button{background:transparent;border-radius:12px;color:#9cacc2;font-size:14px;font-weight:600;padding:12px 6px;transition:background .15s}
nav button.active{background:#233d63;color:#eaf3ff}
section{background:#111925;border:1px solid #263347;border-radius:20px;padding:20px;margin:13px 0;box-shadow:0 8px 28px #00000012}
button{border-radius:12px;background:#26364d;color:#e7f0fc;font-size:14px;font-weight:600;padding:11px 14px}
button.primary,.primary{background:#2563eb;color:#fff}
button:active{transform:scale(.99)}
input,select{background:#0b1320;border:1px solid #30405a;color:#edf3fc;border-radius:12px;padding:13px;outline:none}
input:focus,select:focus{border-color:#3b82f6;box-shadow:0 0 0 2px #3b82f622}
input[type="checkbox"]{accent-color:#3b82f6;box-shadow:none}
label{color:#9aabc1}
.task{border-bottom:1px solid #253348;gap:13px;padding:15px 0}
.task:last-child,.slot:last-child{border-bottom:0}
.task strong{font-size:14px;font-weight:600}
.tag{color:#93a5bf;font-size:12px;line-height:1.8}
.pill{background:#1b3556;color:#90c2ff;border-radius:10px;padding:6px 10px}
.slot{border-bottom:1px solid #263448;padding:15px 0}
.slot strong{font-size:14px;font-weight:600}

</style><style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#090d14;color:#f1f5f9}
*{box-sizing:border-box}body{margin:0;background:#090d14}main{max-width:620px;margin:auto;padding:25px 18px 70px}
header{display:flex;align-items:center;gap:13px;padding:7px 1px 12px}.brand-icon{width:46px;height:46px;display:grid;place-items:center;background:#152b48;border-radius:15px;color:#60a5fa;font-size:27px}
h1{font-size:22px;margin:0 0 3px;letter-spacing:-.5px}h2{font-size:20px;letter-spacing:-.4px;margin:0 0 14px}h3{font-size:16px}
small,.muted{color:#91a0b5}small{font-size:12px}nav{display:flex;gap:5px;margin:18px 0 23px;background:#111a29;padding:5px;border:1px solid #1e2a3d;border-radius:16px}
button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:11px 14px;background:#25364e;color:#edf4ff;font-weight:600;font-size:14px}
nav button{flex:1;background:transparent;color:#9caec5;padding:12px 4px}nav button.active{background:#243d61;color:#f0f6ff}
section,.summary{background:#111a29;border:1px solid #1d2a3c;border-radius:23px;padding:21px;margin:15px 0}
.summary{background:#131e30;border:0;padding:24px 22px}.eyebrow{font-size:12px;letter-spacing:1.2px;color:#9cabc0;margin-bottom:18px;font-weight:600}.summary h2{font-size:28px;margin:0 0 23px;letter-spacing:-.9px}
.summary-stats{display:flex;justify-content:space-between;gap:8px;color:#a6b5c8;font-size:14px}.summary-stats b{color:#60a5fa;font-weight:600;white-space:nowrap}
.progress{height:6px;background:#293b53;border-radius:10px;overflow:hidden;margin-top:18px}.progress div{height:100%;background:#3b82f6;border-radius:10px}
.card-heading{display:flex;align-items:center;justify-content:space-between;gap:12px}.date-label{color:#7f93ae;font-size:12px}.task-card{padding:22px 20px}.task{display:flex;align-items:center;gap:13px;padding:17px 0;border-bottom:1px solid #253248}.task:last-child{border:0;padding-bottom:5px}
.task input[type=checkbox]{appearance:none;width:21px;height:21px;min-width:21px;border:1.5px solid #4b607d;border-radius:7px;background:transparent;cursor:pointer}
.task input[type=checkbox]:checked{background:#2563eb;border-color:#2563eb}.task input[type=checkbox]:checked:after{content:"✓";display:block;text-align:center;color:white;font-size:15px;line-height:18px}
.task-copy{flex:1;min-width:0}.task-copy strong{font-size:14px;font-weight:600;line-height:1.4;display:block;overflow-wrap:anywhere}.tag{font-size:12px;color:#8295af;margin-top:5px}.task-right{display:flex;align-items:center;gap:8px;flex-shrink:0}.task-time{font-size:12px;color:#60a5fa;white-space:nowrap}.delete{padding:5px 8px;background:transparent;color:#74859b;font-size:18px}.task.done .task-copy{text-decoration:line-through;opacity:.55}
.primary{background:#2563eb;color:white}.add-trigger{display:block;width:100%;padding:17px;border-radius:17px;font-size:16px;box-shadow:0 6px 18px #2563eb1c}.hidden{display:none!important}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between}.row>div{flex:1;min-width:0}
input:not([type=checkbox]),select{width:100%;background:#0c1422;border:1px solid #34445d;color:#f0f6ff;padding:12px;border-radius:12px;min-width:0}
label{display:block;margin:12px 0 7px;font-size:13px;color:#9daec4}.full{width:100%;margin-top:15px}.slot{padding:14px 0;border-bottom:1px solid #28374c}.slot strong{display:block;font-size:14px;margin-bottom:6px}.slot .tag{display:inline-block;margin-right:8px}.pill{display:inline-block;background:#193554;color:#9bc8ff;padding:6px 9px;border-radius:10px;font-size:12px}
.warning{color:#ffcc91;font-size:13px}.notice{padding:12px 18px}.empty{font-size:14px;padding:20px 0}footer{text-align:center;color:#71849d;font-size:12px;margin-top:27px}
@media(max-width:380px){main{padding-left:12px;padding-right:12px}.task-card{padding:17px 14px}.task{gap:9px}.task-right{gap:3px}.task-time{font-size:11px}}
</style></head><body><main><header><div class="brand-icon">▣</div><div><h1>Mi Día</h1><small>Organiza menos. Haz más.</small></div></header><nav><button data-view="today">Hoy</button><button class="active" data-view="tomorrow">Mañana</button><button data-view="schedule">Horario</button></nav><div id="content"></div><footer>Privado · Guardado en este dispositivo · v0.1</footer></main>
<script>
const DAYS=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const base=[['07:00','09:00','Música','plan'],['09:00','10:00','Desayuno','busy'],['10:00','11:00','Hogar','plan'],['12:00','13:00','Almuerzo','busy'],['13:00','14:00','Entrenamiento','busy'],['17:00','18:00','Descanso / carro','busy'],['19:00','20:00','Cena','busy']];
const defaultData={profile:'Vacaciones',blocks:Object.fromEntries([1,2,3,4,5].map(d=>[d,base.map(x=>[...x])])),tasks:[]};
let data;try{data=JSON.parse(localStorage.getItem('mi-dia-v1'))||defaultData}catch{data=defaultData}
data.blocks||=defaultData.blocks;data.tasks||=[];data.profile||='Vacaciones';
let view='tomorrow',day=(new Date().getDay()+1)%7;
const save=()=>localStorage.setItem('mi-dia-v1',JSON.stringify(data));
const el=document.getElementById('content');
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=(offset=0)=>{const d=new Date();d.setDate(d.getDate()+offset);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const minutes=t=>{let [h,m]=t.split(':').map(Number);return h*60+m};
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));if(view==='schedule')schedule();else tasks(view==='today'?iso():iso(1))}
function tasks(date){
const selected=data.tasks.filter(t=>t.date===date),dayIndex=new Date(date+'T12:00:00').getDay();
const blocks=(data.blocks[dayIndex]||[]).filter(b=>b[3]==='plan');
const plan=allocate(selected,blocks),pending=selected.filter(t=>!t.done);
const total=pending.reduce((sum,t)=>sum+t.duration,0);
const pct=selected.length?Math.round((selected.length-pending.length)/selected.length*100):0;
el.innerHTML='<div class="summary"><div class="eyebrow">'+(view==='today'?'TU PLAN DE HOY':'TU PLAN DE MAÑANA')+'</div><h2>Un día a la vez.</h2><div class="summary-stats"><span>'+pending.length+' tareas pendientes</span><b>'+Math.floor(total/60)+' h '+String(total%60).padStart(2,'0')+' min</b></div><div class="progress"><div style="width:'+pct+'%"></div></div></div>'+
'<section class="task-card"><div class="card-heading"><h2>Tus tareas</h2><span class="date-label">'+date+'</span></div>'+
(selected.length?selected.map(t=>{const slot=plan.get(t.id);return '<div class="task '+(t.done?'done':'')+'"><input type="checkbox" aria-label="Completar tarea" data-check="'+t.id+'" '+(t.done?'checked':'')+'><div class="task-copy"><strong>'+escapeHtml(t.name)+'</strong><div class="tag">'+escapeHtml(t.cat)+' · '+t.duration+' min</div></div><div class="task-right"><span class="task-time">'+(slot?escapeHtml(slot.split('–')[0]):'Pendiente')+'</span><button class="delete" data-del="'+t.id+'" aria-label="Eliminar tarea">×</button></div></div>'}).join(''):'<p class="muted empty">Todavía no hay tareas. Añade la primera para empezar.</p>')+'</section>'+
'<button id="toggleAdd" class="primary add-trigger">＋ Nueva tarea</button>'+
'<section id="addPanel" class="add-panel hidden"><h2>Nueva tarea</h2><form id="add"><label>¿Qué necesitas hacer?</label><input id="name" placeholder="Escribe una tarea..." maxlength="140" required><div class="row"><div><label>Categoría</label><select id="cat"><option>Música</option><option>Hogar</option><option>Personal</option></select></div><div><label>Duración (min)</label><input id="duration" type="number" min="5" max="480" step="5" value="30" required></div></div><button class="primary full">Guardar tarea</button></form></section>'+
(selected.some(t=>!plan.has(t.id))?'<section class="notice"><p class="warning">Algunas tareas no caben en los bloques disponibles. Tu horario se mantiene intacto.</p></section>':'');
document.getElementById('toggleAdd').onclick=()=>{const p=document.getElementById('addPanel');p.classList.toggle('hidden');if(!p.classList.contains('hidden'))document.getElementById('name').focus()};
document.getElementById('add').onsubmit=e=>{e.preventDefault();const name=document.getElementById('name').value.trim();if(!name)return;data.tasks.push({id:crypto.randomUUID(),date,name,cat:document.getElementById('cat').value,duration:Number(document.getElementById('duration').value),done:false});save();render()};
el.querySelectorAll('[data-check]').forEach(x=>x.onchange=()=>{data.tasks.find(t=>t.id===x.dataset.check).done=x.checked;save();render()});
el.querySelectorAll('[data-del]').forEach(x=>x.onclick=()=>{data.tasks=data.tasks.filter(t=>t.id!==x.dataset.del);save();render()});
}
function allocate(tasks,blocks){let slots=blocks.map(b=>({start:minutes(b[0]),end:minutes(b[1]),cat:b[2]}));const result=new Map();for(const t of tasks){const slot=slots.find(s=>s.cat===t.cat&&s.end-s.start>=t.duration);if(slot){const f=n=>String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');result.set(t.id,f(slot.start)+'–'+f(slot.start+t.duration));slot.start+=t.duration}}return result}
function schedule(){const blocks=data.blocks[day]||[];el.innerHTML='<section><div class="row"><h2>Horario semanal</h2><span class="pill">'+escapeHtml(data.profile)+'</span></div><label>Día</label><select id="day">'+DAYS.map((d,i)=>'<option value="'+i+'" '+(i===day?'selected':'')+'>'+d+'</option>').join('')+'</select><p class="muted">Bloques planificables reciben tareas. Bloques ocupados reservan tiempo.</p>'+blocks.map((b,i)=>'<div class="slot"><strong>'+escapeHtml(b[0])+'–'+escapeHtml(b[1])+' · '+escapeHtml(b[2])+'</strong><span class="tag">'+(b[3]==='plan'?'Planificable':'Ocupado')+'</span> <button data-remove="'+i+'">Eliminar</button></div>').join('')+'<form id="addBlock"><label>Actividad</label><input id="label" required placeholder="Ej. Música" maxlength="80"><div class="row"><div><label>Inicio</label><input type="time" id="start" value="15:00" required></div><div><label>Fin</label><input type="time" id="end" value="16:00" required></div></div><label>Tipo</label><select id="type"><option value="plan">Planificable</option><option value="busy">Ocupado</option></select><button class="primary full">Agregar bloque</button></form></section><section><h3>Respaldo</h3><button id="export">Exportar mis datos</button> <label>Importar respaldo JSON<input type="file" id="import" accept=".json,application/json"></label></section>';
document.getElementById('day').onchange=e=>{day=Number(e.target.value);render()};
el.querySelectorAll('[data-remove]').forEach(x=>x.onclick=()=>{data.blocks[day].splice(Number(x.dataset.remove),1);save();render()});
document.getElementById('addBlock').onsubmit=e=>{e.preventDefault();const a=document.getElementById('start').value,b=document.getElementById('end').value;if(a>=b){alert('La hora final debe ser posterior a la inicial.');return}if(blocks.some(x=>a<x[1]&&b>x[0])){alert('Este bloque se cruza con otro.');return}data.blocks[day]||=[];data.blocks[day].push([a,b,document.getElementById('label').value.trim(),document.getElementById('type').value]);data.blocks[day].sort((x,y)=>x[0].localeCompare(y[0]));save();render()};
document.getElementById('export').onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mi-dia-respaldo.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
document.getElementById('import').onchange=async e=>{try{const obj=JSON.parse(await e.target.files[0].text());if(!obj||!Array.isArray(obj.tasks)||typeof obj.blocks!=='object')throw Error();if(confirm('¿Reemplazar los datos actuales por el respaldo?')){data=obj;save();render()}}catch{alert('Archivo de respaldo inválido')}}}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});render();
</script></body></html>
