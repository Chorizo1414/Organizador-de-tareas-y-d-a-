<script>
const DAYS=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const base=[['07:00','09:00','Música','plan'],['09:00','10:00','Desayuno','busy'],['10:00','11:00','Hogar','plan'],['12:00','13:00','Almuerzo','busy'],['13:00','14:00','Entrenamiento','busy'],['17:00','18:00','Descanso / carro','busy'],['19:00','20:00','Cena','busy']];
const defaultData={profile:'Vacaciones',blocks:Object.fromEntries([1,2,3,4,5].map(d=>[d,base.map(x=>[...x])])),tasks:[]};
let data;try{data=JSON.parse(localStorage.getItem('mi-dia-v1'))||defaultData}catch{data=defaultData}
data.blocks||=defaultData.blocks;data.tasks||=[];data.profile||='Vacaciones';data.profiles||={[data.profile]:structuredClone(data.blocks)};if(!data.profiles[data.profile])data.profiles[data.profile]=structuredClone(data.blocks);data.blocks=data.profiles[data.profile];data.history||=[];data.approvedSlots||={};data.timer||=null;data.reminders||={enabled:false,lead:10,planning:'20:30',repeat:30};data.reminderLog||={};

const el=document.getElementById('content');
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=(offset=0)=>{const d=new Date();d.setDate(d.getDate()+offset);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const minutes=t=>{let [h,m]=t.split(':').map(Number);return h*60+m};
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));if(view==='schedule')schedule();else tasks(view==='today'?iso():iso(1))}
function tasks(date){
const selected=data.tasks.filter(t=>t.date===date),overdue=data.tasks.filter(t=>!t.done&&t.date<date).sort((a,b)=>a.date.localeCompare(b.date)),dayIndex=new Date(date+'T12:00:00').getDay();

const total=pending.reduce((sum,t)=>sum+Number(t.duration||0),0);
const pct=selected.length?Math.round((selected.length-pending.length)/selected.length*100):0;
el.innerHTML='<div class="summary"><div class="eyebrow">'+(view==='today'?'TU PLAN DE HOY':'TU PLAN DE MAÑANA')+'</div><h2>Un día a la vez.</h2><div class="summary-stats"><span>'+pending.length+' tareas pendientes</span><b>'+Math.floor(total/60)+' h '+String(total%60).padStart(2,'0')+' min</b></div><div class="progress"><div style="width:'+pct+'%"></div></div></div>'+
'<section class="task-card"><div class="card-heading"><h2>Tus tareas</h2><span class="date-label">'+date+'</span></div>'+
(selected.length?[...selected].sort((a,b)=>{const x=plan.get(a.id),y=plan.get(b.id);return (x?0:1)-(y?0:1)||(x&&y?x.localeCompare(y):0)||priorityScore(b,date)-priorityScore(a,date)}).map(t=>{const slot=plan.get(t.id);return '<div class="task '+(t.done?'done':'')+'"><input type="checkbox" aria-label="Completar tarea" data-check="'+t.id+'" '+(t.done?'checked':'')+'><div class="task-copy"><strong>'+escapeHtml(t.name)+'</strong><div class="tag">'+escapeHtml(t.cat)+' · '+t.duration+' min'+(t.priority===3?' · Alta prioridad':'')+(t.deadline?' · Límite '+escapeHtml(t.deadline):'')+'</div></div><div class="task-right"><span class="task-time">'+(slot?escapeHtml(slot.split('–')[0]):'Pendiente')+'</span><button class="delete" data-del="'+t.id+'" aria-label="Eliminar tarea">×</button></div></div>'}).join(''):'<p class="muted empty">Todavía no hay tareas. Añade la primera para empezar.</p>')+'</section>'+
overduePanel(date,overdue)+'<button id="toggleAdd" class="primary add-trigger">＋ Nueva tarea</button>'+
'<section id="addPanel" class="add-panel hidden"><h2>Nueva tarea</h2><form id="add"><label>¿Qué necesitas hacer?</label><input id="name" placeholder="Escribe una tarea..." maxlength="140" required><div class="row"><div><label>Categoría</label><select id="cat"><option>Música</option><option>Hogar</option><option>Personal</option></select></div><div><label>Duración (min)</label><input id="duration" type="number" min="5" max="480" step="5" value="30" required></div></div><div class="row"><div><label>Prioridad</label><select id="priority"><option value="2">Normal</option><option value="3">Alta</option><option value="1">Baja</option></select></div><div><label>Fecha límite (opcional)</label><input type="date" id="deadline"></div></div><button class="primary full">Guardar tarea</button></form></section>'+
timerPanel(date)+approvedPanel(date)+(selected.some(t=>!t.done&&!plan.has(t.id))?'<section class="notice"><h3>Necesitan más tiempo</h3><p class="warning">Estas tareas no caben en los bloques actuales. Puedes pasarlas a mañana siguiente sin cambiar tu horario.</p>'+selected.filter(t=>!t.done&&!plan.has(t.id)).map(t=>'<div class="overflow-row"><span>'+escapeHtml(t.name)+'</span><button data-postpone="'+t.id+'">Pasar al día siguiente</button></div>').join('')+'</section>':'')+flexibleSuggestions(date,selected,plan);
el.querySelectorAll('[data-approve]').forEach(b=>b.onclick=()=>{const [a,z]=b.dataset.approve.split('|');const key=date;data.approvedSlots[key]||=[];if(!data.approvedSlots[key].some(x=>x[0]===a&&x[1]===z)){data.approvedSlots[key].push([a,z,'Flexible','flex'])}save();render()});
el.querySelectorAll('[data-recover]').forEach(b=>b.onclick=()=>{const t=data.tasks.find(x=>x.id===b.dataset.recover);if(!t)return;t.date=date;save();render()});
el.querySelectorAll('[data-edit-task]').forEach(b=>b.onclick=()=>{const t=data.tasks.find(x=>x.id===b.dataset.editTask);if(!t)return;const name=prompt('Nombre de la tarea:',t.name);if(name===null)return;if(!name.trim()){alert('El nombre no puede estar vacío.');return}const when=prompt('Fecha (AAAA-MM-DD):',t.date);if(when===null)return;if(!/^\d{4}-\d{2}-\d{2}$/.test(when)||Number.isNaN(new Date(when+'T12:00:00').getTime())){alert('Fecha inválida.');return}t.name=name.trim().slice(0,140);t.date=when;save();render()});
el.querySelectorAll('[data-duration]').forEach(b=>b.onclick=()=>{const t=data.tasks.find(t=>t.id===b.dataset.duration);if(!t)return;const v=prompt('Duración estimada en minutos:',String(t.duration));if(v===null)return;const n=Number(v);if(!Number.isInteger(n)||n<1||n>1440){alert('Introduce entre 1 y 1440 minutos.');return}t.duration=n;save();render()});
el.querySelectorAll('[data-timer]').forEach(b=>b.onclick=()=>{const id=b.dataset.timer;if(data.timer&&data.timer.id!==id){alert('Pausa o termina el temporizador actual antes de iniciar otro.');return}if(!data.timer)data.timer={id,elapsed:0,startedAt:Date.now(),running:true};else if(data.timer.running){data.timer.elapsed+=Math.max(0,Date.now()-data.timer.startedAt);data.timer.running=false}else{data.timer.startedAt=Date.now();data.timer.running=true}save();render()});
const stop=document.getElementById('stopTimer');if(stop)stop.onclick=()=>{const timer=data.timer;const t=data.tasks.find(x=>x.id===timer?.id);if(!timer||!t)return;const elapsed=timer.elapsed+(timer.running?Math.max(0,Date.now()-timer.startedAt):0);const actual=Math.max(1,Math.round(elapsed/60000));const v=prompt('Tiempo medido: '+actual+' min. Corrige si es necesario:',String(actual));if(v===null)return;const n=Number(v);if(!Number.isFinite(n)||n<1||n>1440){alert('Duración inválida');return}data.history.push({name:t.name,cat:t.cat,duration:n,date:iso()});t.actualDuration=n;data.timer=null;save();render()};
el.querySelectorAll('[data-revoke]').forEach(b=>b.onclick=()=>{const idx=Number(b.dataset.revoke);data.approvedSlots[date].splice(idx,1);save();render()});
document.getElementById('toggleAdd').onclick=()=>{const p=document.getElementById('addPanel');p.classList.toggle('hidden');if(!p.classList.contains('hidden'))document.getElementById('name').focus()};
document.getElementById('name').addEventListener('input',e=>{const match=[...data.history].reverse().find(h=>h.name.trim().toLowerCase()===e.target.value.trim().toLowerCase());if(match){document.getElementById('duration').value=estimate(e.target.value);document.getElementById('cat').value=match.cat}});
document.getElementById('add').onsubmit=e=>{e.preventDefault();const name=document.getElementById('name').value.trim();if(!name)return;data.tasks.push({id:crypto.randomUUID(),date,name,cat:document.getElementById('cat').value,duration:Number(document.getElementById('duration').value),priority:Number(document.getElementById('priority').value),deadline:document.getElementById('deadline').value,done:false});save();render()};
el.querySelectorAll('[data-check]').forEach(x=>x.onchange=()=>{const t=data.tasks.find(t=>t.id===x.dataset.check);if(!t)return;if(x.checked&&!t.done){const answer=prompt('¿Cuántos minutos tardaste realmente? (opcional)',String(t.duration));const actual=Number(answer);if(answer!==null&&Number.isFinite(actual)&&actual>=1&&actual<=1440){t.actualDuration=actual;data.history.push({name:t.name,cat:t.cat,duration:actual,date:iso()});}}t.done=x.checked;save();render()});
el.querySelectorAll('[data-del]').forEach(x=>x.onclick=()=>{data.tasks=data.tasks.filter(t=>t.id!==x.dataset.del);save();render()});
el.querySelectorAll('[data-postpone]').forEach(x=>x.onclick=()=>{const t=data.tasks.find(t=>t.id===x.dataset.postpone);if(!t)return;const d=new Date(t.date+'T12:00:00');d.setDate(d.getDate()+1);t.date=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');save();render()});
}
function overduePanel(date,items){
if(!items.length)return '';
return '<section class="overdue-panel"><div class="card-heading"><h2>Tareas atrasadas</h2><span class="pill">'+items.length+'</span></div><p class="muted">No las movemos automáticamente. Elige cuáles quieres recuperar para este día.</p>'+items.slice(0,12).map(t=>'<div class="overflow-row"><span><strong>'+escapeHtml(t.name)+'</strong><small class="overdue-date">Desde '+escapeHtml(t.date)+'</small></span><button data-recover="'+t.id+'">Mover a este día</button></div>').join('')+(items.length>12?'<p class="muted">Hay más tareas atrasadas. Recupera algunas para ver las restantes.</p>':'')+'</section>';
}
function estimate(name){const a=data.history.filter(h=>h.name.trim().toLowerCase()===name.trim().toLowerCase()).slice(-8).map(h=>Number(h.duration)).filter(n=>n>0);if(!a.length)return 30;return Math.max(5,Math.round((a.reduce((x,y)=>x+y,0)/a.length)/5)*5)}
function priorityScore(t,date){const p=Number(t.priority)||2;let score=p*100;if(t.deadline){const days=Math.round((new Date(t.deadline+'T12:00:00')-new Date(date+'T12:00:00'))/86400000);score+=days<=0?250:Math.max(0,100-days*20)}return score}
function allocate(tasks,blocks,date){
const slots=[...blocks,...(data.approvedSlots[date]||[])].map(b=>({start:minutes(b[0]),end:minutes(b[1]),cat:b[2],flex:b[3]==='flex'})).sort((a,b)=>a.start-b.start);
const result=new Map();const ordered=[...tasks].filter(t=>!t.done).sort((a,b)=>priorityScore(b,date)-priorityScore(a,date)||Number(a.duration)-Number(b.duration));
const fmt=n=>String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');
for(const t of ordered){const duration=Number(t.duration);if(!Number.isFinite(duration)||duration<=0)continue;
const slot=slots.find(s=>!s.flex&&s.cat===t.cat&&s.end-s.start>=duration)||slots.find(s=>s.flex&&s.end-s.start>=duration);
if(slot){result.set(t.id,fmt(slot.start)+'–'+fmt(slot.start+duration));slot.start+=duration}}
return result}
function timerPanel(date){const timer=data.timer;if(!timer)return '';const t=data.tasks.find(x=>x.id===timer.id);if(!t)return '';const elapsed=timer.elapsed+(timer.running?Math.max(0,Date.now()-timer.startedAt):0);return '<section class="timer-panel"><h3>Temporizador '+(timer.running?'en marcha':'en pausa')+'</h3><p>'+escapeHtml(t.name)+'</p><strong>'+Math.floor(elapsed/60000)+' min registrados</strong><p class="muted">El tiempo sigue contando mientras la aplicación esté cerrada si el temporizador está activo.</p><button id="stopTimer">Finalizar y guardar duración</button></section>'}
function approvedPanel(date){const slots=data.approvedSlots[date]||[];return slots.length?'<section class="notice"><h3>Espacios autorizados</h3>'+slots.map((b,i)=>'<div class="overflow-row"><span>'+escapeHtml(b[0])+'–'+escapeHtml(b[1])+'</span><button data-revoke="'+i+'">Retirar</button></div>').join('')+'</section>':''}
function flexibleSuggestions(date,tasks,plan){
const missing=tasks.filter(t=>!t.done&&!plan.has(t.id));if(!missing.length)return '';
const dayIndex=new Date(date+'T12:00:00').getDay();
const occupied=[...(data.blocks[dayIndex]||[]),...(data.approvedSlots[date]||[])].map(b=>[minutes(b[0]),minutes(b[1])]).sort((a,b)=>a[0]-b[0]);
const gaps=[];let cursor=7*60;for(const [a,z] of occupied){if(a>cursor&&a-cursor>=15)gaps.push([cursor,a]);cursor=Math.max(cursor,z)}if(cursor<20*60&&20*60-cursor>=15)gaps.push([cursor,20*60]);
const required=Math.min(...missing.map(t=>Number(t.duration)||30));const options=gaps.filter(([a,b])=>b-a>=required).slice(0,3);
const fmt=n=>String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');
return options.length?'<section class="notice"><h3>Espacios libres sugeridos</h3><p class="muted">Estos huecos no se usarán sin tu autorización. Revisa antes si realmente estás disponible.</p>'+options.map(([a,b])=>'<div class="overflow-row"><span>'+fmt(a)+'–'+fmt(b)+'</span><button data-approve="'+fmt(a)+'|'+fmt(b)+'">Autorizar</button></div>').join('')+'</section>':'';
}

function notificationStatus(){
if(!('Notification' in window))return 'Notificaciones del sistema no disponibles. Se mostrarán avisos dentro de Mi Día.';
const p=Notification.permission;return p==='granted'?'Permiso concedido. Prueba el aviso con el botón.':p==='denied'?'Notificaciones bloqueadas. Habilítalas en los ajustes de Android para Mi Día o Chrome.':'Permiso pendiente. Pulsa «Permitir notificaciones».';
}
function refreshReminderStatus(){
const test=document.getElementById('scheduledTestStatus');if(test)test.textContent=data.reminderTest?.at?'Prueba pendiente: '+new Date(data.reminderTest.at).toLocaleTimeString('es-GT',{hour:'2-digit',minute:'2-digit',second:'2-digit'}):'Sin prueba programada.';
const target=document.getElementById('nextReminderStatus');if(!target)return;
if(!data.reminders.enabled){target.textContent='Recordatorios desactivados.';return}
const now=new Date(),time=data.reminders.planning||'20:30',today=iso(),done=!!data.reminderLog[today+'|plan'];
const next=done||now.getHours()*60+now.getMinutes()>minutes(time)?'mañana':'hoy';
target.textContent='Próximo aviso de planificación: '+next+' a las '+time+'. Debes mantener Mi Día abierta y visible para recibirlo a esa hora.';
}
function checkReminders(){
if(data.reminderTest?.at&&Date.now()>=data.reminderTest.at&&!document.hidden){const at=data.reminderTest.at;data.reminderTest=null;save();sendReminder('scheduled-test|'+at,'Prueba programada de Mi Día','El aviso automático se activó mientras Mi Día estaba abierta.');refreshReminderStatus()}
if(!data.reminders.enabled)return;
const now=new Date(),today=iso(),mins=now.getHours()*60+now.getMinutes(),lead=Number(data.reminders.lead)||0,repeat=Number(data.reminders.repeat)||0;
const planTime=minutes(data.reminders.planning||'20:30'),planKey=today+'|plan';
if(mins>=planTime&&!data.reminderLog[planKey]&&!document.hidden)sendReminder(planKey,'Prepara tu día de mañana','Revisa o agrega las tareas para mañana.');
const blocks=(data.blocks[now.getDay()]||[]).filter(b=>b[3]==='plan');
const plan=allocate(data.tasks.filter(t=>t.date===today),blocks,today);
for(const t of data.tasks.filter(t=>t.date===today&&!t.done)){
const slot=plan.get(t.id);if(!slot)continue;
const start=minutes(slot.split('–')[0]),delta=mins-(start-lead);
if(delta<0)continue;
const limit=Math.max(0,Number(t.duration))+120;
if(delta>limit)continue;
const step=repeat>0?Math.floor(delta/repeat):0;
if(!repeat&&delta>2)continue;
const key=today+'|'+t.id+'|'+step;
if(!data.reminderLog[key])sendReminder(key,'Tarea pendiente: '+t.name,'Horario previsto: '+slot);
}
}
async function sendReminder(key,title,body){
data.reminderLog[key]=Date.now();
const keys=Object.keys(data.reminderLog);if(keys.length>500){for(const k of keys.slice(0,keys.length-300))delete data.reminderLog[k]}save();
let banner=document.getElementById('reminderBanner');
if(!banner){banner=document.createElement('div');banner.id='reminderBanner';banner.setAttribute('role','status');document.body.appendChild(banner)}
banner.textContent=title+' — '+body+'  ·  Toca para cerrar';banner.onclick=()=>banner.remove();
if(!('Notification' in window)||Notification.permission!=='granted')return;
try{
if('serviceWorker' in navigator){const registration=await navigator.serviceWorker.ready;await registration.showNotification(title,{body,icon:'./icon.svg',badge:'./icon.svg',tag:key});return}
new Notification(title,{body,icon:'./icon.svg',tag:key});
}catch(err){console.warn('Notificación del sistema no disponible:',err)}
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});render();checkReminders();setInterval(()=>{if(!document.hidden){checkReminders();refreshReminderStatus()}},5000);document.addEventListener('visibilitychange',()=>{if(!document.hidden){checkReminders();refreshReminderStatus()}});window.addEventListener('focus',()=>{checkReminders();refreshReminderStatus()});

</script></body></html>
