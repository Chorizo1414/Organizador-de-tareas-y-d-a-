<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171c2c"><title>Mi Día</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#eef0f7;background:#171c2c}*{box-sizing:border-box}body{margin:0}main{max-width:650px;margin:auto;padding:22px 16px 80px}h1{font-size:28px;margin:0}small,.muted{color:#a5aec5}nav{display:flex;gap:7px;margin:22px 0}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:11px 14px;background:#333c55;color:#fff}button.active,.primary{background:#8978db;color:white}nav button{flex:1}section{background:#222a3e;border:1px solid #35405c;border-radius:17px;padding:17px;margin:12px 0}.row{display:flex;align-items:center;gap:10px;justify-content:space-between}.row>div{flex:1}input,select{width:100%;background:#171e30;border:1px solid #4a5570;color:white;padding:12px;border-radius:10px}label{display:block;margin:10px 0 5px;font-size:13px;color:#bbc3d7}.task{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #39415a}.task input{width:20px}.task span{flex:1}.task.done span{text-decoration:line-through;opacity:.5}.tag{font-size:12px;color:#aab6d1}.full{width:100%;margin-top:12px}.hidden{display:none}.slot{padding:12px 0;border-bottom:1px solid #3c465e}.slot strong{display:block}.warning{color:#ffd19a}.pill{display:inline-block;background:#35405b;padding:4px 8px;border-radius:8px;font-size:12px}footer{margin-top:22px;text-align:center;color:#8995af;font-size:12px}
</style><style>
/* Mi Día 0.2: minimal dark-blue visual system */
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#090d14;color:#edf3fc}
body{background:#090d14}
main{max-width:610px;padding:28px 17px 85px}
header{padding:8px 3px 3px}
h1{font-size:27px;letter-spacing:-.9px;font-weight:720}
h2{font-size:19px;letter-spacing:-.45px;margin:0 0 10px}
h3{font-size:16px}
small,.muted{color:#8b9bb2}
nav{background:#121a27;border:1px solid #253246;padding:5px;border-radius:17px;gap:4px;margin:24px 0 18px}
nav button{background:transparent;border-radius:12px;color:#9cacc2;font-size:14px;font-weight:600;padding:12px 6px;transition:background .15s}
nav button.active{background:#233d63;color:#eaf3ff}
section{background:#111925;border:1px solid #263347;border-radius:20px;padding:20px;margin:13px 0;box-shadow:0 8px 28px #00000012}
button{border-radius:12px;background:#26364d;color:#e7f0fc;font-size:14px;font-weight:600;padding:11px 14px}
button.primary,.primary{background:#2563eb;color:#fff}
button:active{transform:scale(.99)}
input,select{background:#0b1320;border:1px solid #30405a;color:#edf3fc;border-radius:12px;padding:13px;outline:none}
input:focus,select:focus{border-color:#3b82f6;box-shadow:0 0 0 2px #3b82f622}
input[type="checkbox"]{accent-color:#3b82f6;box-shadow:none}
label{color:#9aabc1}
.task{border-bottom:1px solid #253348;gap:13px;padding:15px 0}
.task:last-child,.slot:last-child{border-bottom:0}
.task strong{font-size:14px;font-weight:600}
.tag{color:#93a5bf;font-size:12px;line-height:1.8}
.pill{background:#1b3556;color:#90c2ff;border-radius:10px;padding:6px 10px}
.slot{border-bottom:1px solid #263448;padding:15px 0}
.slot strong{font-size:14px;font-weight:600}
.warning{color:#ffcf92}
footer{color:#71849d}
</style></head><body><main><header><h1>Mi Día</h1><small>Tu tiempo, bien utilizado.</small></header><nav><button data-view="today">Hoy</button><button class="active" data-view="tomorrow">Mañana</button><button data-view="schedule">Horario</button></nav><div id="content"></div><footer>Privado · Guardado en este dispositivo · v0.1</footer></main>
<script>
const DAYS=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const base=[['07:00','09:00','Música','plan'],['09:00','10:00','Desayuno','busy'],['10:00','11:00','Hogar','plan'],['12:00','13:00','Almuerzo','busy'],['13:00','14:00','Entrenamiento','busy'],['17:00','18:00','Descanso / carro','busy'],['19:00','20:00','Cena','busy']];
const defaultData={profile:'Vacaciones',blocks:Object.fromEntries([1,2,3,4,5].map(d=>[d,base.map(x=>[...x])])),tasks:[]};
let data;try{data=JSON.parse(localStorage.getItem('mi-dia-v1'))||defaultData}catch{data=defaultData}
data.blocks||=defaultData.blocks;data.tasks||=[];data.profile||='Vacaciones';
let view='tomorrow',day=(new Date().getDay()+1)%7;
const save=()=>localStorage.setItem('mi-dia-v1',JSON.stringify(data));
const el=document.getElementById('content');
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=(offset=0)=>{const d=new Date();d.setDate(d.getDate()+offset);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const minutes=t=>{let [h,m]=t.split(':').map(Number);return h*60+m};
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));if(view==='schedule')schedule();else tasks(view==='today'?iso():iso(1))}
function tasks(date){const selected=data.tasks.filter(t=>t.date===date),dayIndex=new Date(date+'T12:00:00').getDay();const blocks=(data.blocks[dayIndex]||[]).filter(b=>b[3]==='plan');const plan=allocate(selected,blocks);
el.innerHTML='<section><div class="row"><div><h2>'+(view==='today'?'Hoy':'Prepara mañana')+'</h2><small>'+date+'</small></div><span class="pill">'+selected.filter(t=>t.done).length+'/'+selected.length+' completadas</span></div><form id="add"><label>Nueva tarea</label><input id="name" placeholder="¿Qué necesitas hacer?" maxlength="140" required><div class="row"><div><label>Categoría</label><select id="cat"><option>Música</option><option>Hogar</option><option>Personal</option></select></div><div><label>Minutos</label><input id="duration" type="number" min="5" max="480" step="5" value="30" required></div></div><button class="primary full">Añadir tarea</button></form></section><section><h2>Plan del día</h2>'+ (selected.length?selected.map(t=>{const slot=plan.get(t.id);return '<div class="task '+(t.done?'done':'')+'"><input type="checkbox" data-check="'+t.id+'" '+(t.done?'checked':'')+'><span><strong>'+escapeHtml(t.name)+'</strong><span class="tag">'+escapeHtml(t.cat)+' · '+t.duration+' min · '+(slot?slot:'Sin espacio asignado')+'</span></span><button data-del="'+t.id+'" aria-label="Eliminar tarea">×</button></div>'}).join(''):'<p class="muted">Todavía no hay tareas.</p>')+'</section>'+(selected.some(t=>!plan.has(t.id))?'<section><p class="warning">Hay tareas sin espacio compatible. No moveremos tus actividades sin tu permiso.</p></section>':'');
document.getElementById('add').onsubmit=e=>{e.preventDefault();data.tasks.push({id:crypto.randomUUID(),date,name:document.getElementById('name').value.trim(),cat:document.getElementById('cat').value,duration:Number(document.getElementById('duration').value),done:false});save();render()};
el.querySelectorAll('[data-check]').forEach(x=>x.onchange=()=>{data.tasks.find(t=>t.id===x.dataset.check).done=x.checked;save();render()});
el.querySelectorAll('[data-del]').forEach(x=>x.onclick=()=>{data.tasks=data.tasks.filter(t=>t.id!==x.dataset.del);save();render()})}
function allocate(tasks,blocks){let slots=blocks.map(b=>({start:minutes(b[0]),end:minutes(b[1]),cat:b[2]}));const result=new Map();for(const t of tasks){const slot=slots.find(s=>s.cat===t.cat&&s.end-s.start>=t.duration);if(slot){const f=n=>String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');result.set(t.id,f(slot.start)+'–'+f(slot.start+t.duration));slot.start+=t.duration}}return result}
function schedule(){const blocks=data.blocks[day]||[];el.innerHTML='<section><div class="row"><h2>Horario semanal</h2><span class="pill">'+escapeHtml(data.profile)+'</span></div><label>Día</label><select id="day">'+DAYS.map((d,i)=>'<option value="'+i+'" '+(i===day?'selected':'')+'>'+d+'</option>').join('')+'</select><p class="muted">Bloques planificables reciben tareas. Bloques ocupados reservan tiempo.</p>'+blocks.map((b,i)=>'<div class="slot"><strong>'+escapeHtml(b[0])+'–'+escapeHtml(b[1])+' · '+escapeHtml(b[2])+'</strong><span class="tag">'+(b[3]==='plan'?'Planificable':'Ocupado')+'</span> <button data-remove="'+i+'">Eliminar</button></div>').join('')+'<form id="addBlock"><label>Actividad</label><input id="label" required placeholder="Ej. Música" maxlength="80"><div class="row"><div><label>Inicio</label><input type="time" id="start" value="15:00" required></div><div><label>Fin</label><input type="time" id="end" value="16:00" required></div></div><label>Tipo</label><select id="type"><option value="plan">Planificable</option><option value="busy">Ocupado</option></select><button class="primary full">Agregar bloque</button></form></section><section><h3>Respaldo</h3><button id="export">Exportar mis datos</button> <label>Importar respaldo JSON<input type="file" id="import" accept=".json,application/json"></label></section>';
document.getElementById('day').onchange=e=>{day=Number(e.target.value);render()};
el.querySelectorAll('[data-remove]').forEach(x=>x.onclick=()=>{data.blocks[day].splice(Number(x.dataset.remove),1);save();render()});
document.getElementById('addBlock').onsubmit=e=>{e.preventDefault();const a=document.getElementById('start').value,b=document.getElementById('end').value;if(a>=b){alert('La hora final debe ser posterior a la inicial.');return}if(blocks.some(x=>a<x[1]&&b>x[0])){alert('Este bloque se cruza con otro.');return}data.blocks[day]||=[];data.blocks[day].push([a,b,document.getElementById('label').value.trim(),document.getElementById('type').value]);data.blocks[day].sort((x,y)=>x[0].localeCompare(y[0]));save();render()};
document.getElementById('export').onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mi-dia-respaldo.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
document.getElementById('import').onchange=async e=>{try{const obj=JSON.parse(await e.target.files[0].text());if(!obj||!Array.isArray(obj.tasks)||typeof obj.blocks!=='object')throw Error();if(confirm('¿Reemplazar los datos actuales por el respaldo?')){data=obj;save();render()}}catch{alert('Archivo de respaldo inválido')}}}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});render();
</script></body></html>
